name: Bug report
description: Report a fault in the acquisition software, firmware or documentation
title: "[bug] "
body:
  - type: markdown
    attributes:
      value: |
        Read [SAFETY.md](https://github.com/mikey-7x/Project-Synapse-v1-official-Real-Time-Brainwave-Decoder-with-Android/blob/main/SAFETY.md)
        and `docs/TROUBLESHOOTING.md` first. Never test on a person while the hardware is
        connected to anything mains-powered.
        This repository is `POWERED BY [mikey:hexoid-sys]` by mikey-7x.
  - type: input
    id: version
    attributes:
      label: Engine build
      description: Which script, and which version string the UI shows
      placeholder: next_synapse.py, PROJECT SYNAPSE v19.0
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform and versions
      description: Device, OS, Python version, TensorFlow version
      placeholder: Android 14, Termux + PRoot Arch, Python 3.11.9, TF 2.15
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Acquisition / connection
        - Signal quality
        - Trinx extraction
        - Training
        - Prediction
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the label, number of strips and what you expected to happen
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Output
      description: Console traceback or log lines
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: The hardware was battery-powered and isolated during this test
          required: true
        - label: I understand this project makes no medical or diagnostic claim
          required: true
        - label: I ran `python3 tools/verify_repository.py` and pasted the output if it failed
